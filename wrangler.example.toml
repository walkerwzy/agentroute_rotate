# Copy to wrangler.toml, then run npm run setup to create/reuse the database.
name = "codex-proxy"
main = "worker.js"
compatibility_date = "2026-11-04"
keep_vars = true
workers_dev = true

# For multiple Cloudflare accounts, set account_id or CLOUDFLARE_ACCOUNT_ID.
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
# To use a hostname in an active Cloudflare zone, configure this before deploying:
# routes = [{ pattern = "proxy.example.com", custom_domain = true }]
# Set workers_dev = false above if only the custom domain should be accessible.

[vars]
UPSTREAM_BASE = "https://agentrouter.org/v1"
UPSTREAM_API = "auto"
KEY_COOLDOWN_SECONDS = "300"
ROUTING_LOGS = "on"

[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "assets"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "codex-proxy-state"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Daily cleanup at 00:00 UTC; keeps 7 days of history and all-time counters.
[triggers]
crons = ["0 0 * * *"]

# Run npm run secrets to save local credentials; npm run deploy uploads them.
